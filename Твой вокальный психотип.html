<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Твой вокальный психотип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Inter:wght@400;600&family=Caveat:wght@600&display=swap">
<style>
:root{--bg:#f4ead8;--cd:#fbf5e9;--tx:#2e1117;--bu:#6b1d2a;--mu:#8a6a66;--ln:#d9c7a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#26090f;--cd:#37131c;--tx:#f4ead8;--bu:#e8a9b3;--mu:#c0a29c;--ln:#5a2a34}}
:root[data-theme=dark]{--bg:#26090f;--cd:#37131c;--tx:#f4ead8;--bu:#e8a9b3;--mu:#c0a29c;--ln:#5a2a34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
.w{max-width:640px;margin:auto;padding:22px 18px 60px}
h1,h2{font-family:'Playfair Display',Georgia,serif;color:var(--bu);line-height:1.1;margin:.2em 0}h1{font-size:2.6rem;font-weight:800}h2{font-size:1.5rem}
h3{font:600 .75rem Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--bu);margin:1.6em 0 .3em;border-top:1px solid var(--ln);padding-top:.9em}
.hand{font:600 1.3rem Caveat,cursive;color:var(--bu)}.m{color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:4px;padding:20px;margin:16px 0;box-shadow:4px 4px 0 var(--ln)}
.stamp{display:inline-block;border:2px solid var(--bu);color:var(--bu);padding:3px 12px;font:600 .7rem Inter;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-4deg);border-radius:3px}
.btn{display:block;width:100%;text-align:left;background:var(--cd);color:var(--tx);border:1px solid var(--bu);border-radius:3px;padding:14px 16px;margin:10px 0;font:inherit;cursor:pointer;transition:.2s}
.btn:hover{background:var(--bu);color:var(--bg)}
.go{background:var(--bu);color:var(--bg);text-align:center;font-weight:600;text-decoration:none}
.bar{height:4px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--bu);transition:.4s}
.cnt{font:600 .9rem Inter;letter-spacing:.1em;color:var(--bu);display:flex;justify-content:space-between;margin:12px 0 4px}
.cols div{margin:8px 0;padding-left:12px;border-left:3px solid var(--bu)}
.sb{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:4px 0}.sb span{width:110px}.sb i{height:8px;background:var(--bu);display:block}
ul{padding-left:20px}li{margin:5px 0}small{color:var(--mu)}
</style></head><body><div class="w"><div id="app"></div></div>
<script>
const IG="https://instagram.com/annieanniemusic";
const FN={o:"Оральный",a:"Анальный",f:"Фаллический",l:"Латентный",g:"Генитальный"};
const AF={o:'g',a:'l',f:'o',l:'a',g:'f'};
const T={
o:{n:"Голос контакта",s:"Пою, чтобы меня услышали",two:"Тепло, отклик, близость к слушателю.",body:"У людей с такими поведенческими привычками иногда встречается высокое дыхание, подвижные плечи и желание тянуться к слушателю корпусом.",snd:"Тёплый мягкий тембр и мягкая атака. В вокальной практике нередко не хватает опоры и чёткости окончаний слов.",pw:"Эмоциональная правда и контакт со слушателем.",tr:"Звук теряется без отклика зала. Ресурс: учиться опираться на дыхание, а не на реакцию.",rp:"Лирика, соул, акустика, средние темпы, камерные залы.",vb:"Мягкие ткани, тёплый взгляд в зал, микрофон ближе, открытые жесты.",tn:["Нижне-рёберное дыхание","Чёткие окончания слов","Опора на выдох","Пение без зрителя"],pl:["Свобода плеч и шеи, подвижность корпуса","Нижне-рёберное дыхание, выдох на «ф-ф-ф»","Окончания слов и мягкая атака","Песня без зрителя, потом одному слушателю"]},
a:{n:"Голос контроля",s:"Пою точно, потому что ценю порядок",two:"Точность, структура, дисциплина.",body:"Если человек склонен к контролю, это может сопровождаться напряжением челюсти и шеи или задержкой дыхания. Это не правило: многие перфекционисты поют свободно.",snd:"Чёткая дикция и чистая интонация. Иногда звук «прилизан», а гортань пережата.",pw:"Точность, надёжность, работа над деталями.",tr:"Перфекционизм делает звук стерильным и усиливает страх ошибки. Ресурс: ошибка как эксперимент.",rp:"Джаз-стандарты, классика, поп с чёткой формой.",vb:"Строгий силуэт, точные жесты, минимум декора, выверенный образ.",tn:["SOVT: трель и соломинка","Свободная челюсть и язык","Лёгкое легато","Эмоциональная подача"],pl:["Расслабление челюсти и языка, зевок","Дыхание без задержки, губная трель","Лёгкое легато и нестрогая атака","Ошибка нарочно и импровизация на 4 такта"]},
f:{n:"Голос проявленности",s:"Пою, чтобы меня заметили",two:"Сила, харизма, вызов.",body:"В вокальной практике это иногда проявляется как выраженная экспрессия корпуса и склонность давить на выдохе.",snd:"Яркий громкий звук и мощная атака. Риск: крик вместо опоры и хрипота.",pw:"Харизма и сценическое присутствие.",tr:"Форсирование: сила вместо техники. Ресурс: направить энергию в опору.",rp:"Рок, поп-рок, мюзикл, драматичные баллады.",vb:"Яркие акценты, смелые силуэты, прямой взгляд, большая амплитуда движений.",tn:["Мягкая атака звука","Микс на высоких нотах","Опора без нажима","Динамика: пиано"],pl:["Разогрев и снижение мышечного давления","Опора на выдох без нажима","Микс и мягкая атака на высоких нотах","Динамика: от шёпота до форте"]},
l:{n:"Голос наблюдателя",s:"Пою внутри, потому что там безопасно",two:"Глубина, тонкость, внутренний мир.",body:"У людей, которым трудно показывать голос, иногда встречается закрытая поза, втянутые плечи и мелкое дыхание на людях.",snd:"Тихий, тонко окрашенный звук, внимание к нюансам. При публике звук может уходить.",pw:"Слух, нюансы, глубина.",tr:"Откладывание выхода и самокритика. Ресурс: безопасные ступени публичности.",rp:"Инди, фолк, камерные баллады, авторская песня.",vb:"Сдержанная эстетика, минимализм, камерный свет, игра с паузой.",tn:["Дыхание 4-7-8","Резонаторы","Ступени публичности","Дневник голоса"],pl:["Мягкая разминка перед зеркалом","Дыхание 4-7-8 и гул «м-м-м»","Звук в резонаторах, чуть громче","Первый мини-выход: другу, затем в сторис"]},
g:{n:"Голос целостности",s:"Пою свободно и осознанно",two:"Баланс, гибкость, устойчивость.",body:"Обычно такие люди имеют подвижный корпус и ровное дыхание, но это наблюдение, а не гарантия.",snd:"Баланс чёткости и эмоции, гибкая динамика.",pw:"Гибкость и устойчивость.",tr:"Застой: комфорта достаточно, и рост замедляется. Ресурс: новые задачи.",rp:"Любые жанры, ищи песни с новой задачей.",vb:"Естественность, свободная пластика, живой контакт.",tn:["Регистры и микс","Динамика","Жанровые эксперименты","Импровизация"],pl:["Диагностика: что свободно, что нет","Дыхание и регистры","Новый жанр или язык","Мини-концерт и разбор записи"]}};
const Q=[
["Преподаватель просит сменить привычную манеру исполнения. Первая реакция:",["Спрашиваю, нравится ли ему, как я пою сейчас","Хочу понять правило: что именно и почему меняем","Пробую сразу и громко, посмотрим, что выйдет","Соглашаюсь, но пробую дома без свидетелей","Проверяю на себе и решаю, что оставить"]],
["Перед выступлением тело обычно:",["Тянет к людям: хочется поговорить","Собрано, проверяю каждую мелочь","Заводится, хочется выйти скорее","Уходит в себя, нужна тишина","Волнуется, но остаётся подвижным"]],
["Ошибка на сцене. Что происходит первым:",["Ищу глазами реакцию зала","Мысленно разбираю, где был сбой","Делаю вид, что так и задумано","Замыкаюсь и жду конца песни","Фиксирую и продолжаю петь"]],
["Выбираю песню для выступления. Мне нужна та,",["что трогает меня и слушателей","где можно показать чистую технику","с которой можно взорвать зал","которую люблю тайно, пою для себя","что даёт мне новую задачу"]],
["Дыхание, когда я волнуюсь:",["Сбивается на вдохе, дышу высоко","Задерживается, будто держу всё под контролем","Бью выдохом, звук идёт на силе","Становится мелким и тихим","Остаётся достаточно ровным"]],
["Импровизация для меня:",["Хороша, если рядом тепло и поддержка","Не моё: хочу знать структуру","Стихия, обожаю","Нравится наедине, но не при людях","Интересна, если есть рамка"]],
["Работаю с текстом песни:",["Представляю человека, которому пою","Разбираю каждое слово и ударение","Играю роль, проживаю как кино","Ищу подтекст и скрытый смысл","Нахожу личную историю и подаю её просто"]],
["Слушаю запись своего голоса:",["Проверяю, тронуло бы это меня","По секундам выписываю ошибки","Ищу, где звучит мощно","Откладываю и слушаю втайне","Спокойно отмечаю плюсы и задачи"]],
["Мне сказали, что в пении есть проблема:",["Важно, чтобы сказали мягко","Прошу конкретику, чтобы исправить","Сначала вспыхиваю, потом думаю","Молчу, но долго обдумываю","Различаю, что полезно, что нет"]],
["Репетирую:",["Лучше с кем-то, чтобы не скучно","По плану, с метрономом и записью","Сразу в полную силу, как на концерте","В одиночестве, с закрытой дверью","По самочувствию, в разном темпе"]],
["Микрофон для меня:",["Собеседник, тянусь к нему ближе","Инструмент, держу на точной дистанции","Атрибут, играю им и двигаюсь","Щит, держу дальше или прячусь за ним","Часть звука, двигаюсь свободно, слушаю"]],
["После выступления мне нужно:",["Услышать слова поддержки","Прокрутить, что можно улучшить","Остаться заряженным и петь ещё","Побыть одному и выдохнуть","Порадоваться и записать выводы"]]];
const K=['o','a','f','l','g'],$=document.getElementById('app');let qi,sc;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function start(){qi=0;sc={o:0,a:0,f:0,l:0,g:0};$.innerHTML=`<span class=stamp>тест · не диагноз</span><h1>Твой вокальный психотип</h1><p class=hand>что твой голос рассказывает о тебе</p>
<p>Через метафору психосексуальных стадий Фрейда мы посмотрим на твои вокальные привычки: дыхание, тело, отношение к ошибкам и сцене. 12 вопросов, 3 минуты.</p>
<div class=card><h2>Что здесь правда</h2><div class=cols>
<div><b>Теория Фрейда.</b> Историческая модель стадий. Эмпирически она не доказана и не является способом диагностики.</div>
<div><b>Вокальная физиология.</b> Дыхание, гортань, зажимы и опора это реальные навыки, с ними можно работать.</div>
<div><b>Авторская интерпретация.</b> Связь между стилем поведения и звуком мы используем как метафору для саморефлексии, а не как причину.</div></div></div>
<button class="btn go" onclick="ask()">Начать</button>`}
function ask(){if(qi>=Q.length)return res();const q=Q[qi];A=q[1].map((t,i)=>[t,K[i]]);
$.innerHTML=`<div class=cnt><span>${String(qi+1).padStart(2,'0')} / ${Q.length}</span><span class=m>осталось ${Q.length-qi-1}</span></div><div class=bar><i style="width:${qi/Q.length*100}%"></i></div><div class=card><h2>${q[0]}</h2>${shuf(A).map(([t,k])=>`<button class=btn onclick="pick('${k}')">${t}</button>`).join('')}</div>`}
function pick(k){sc[k]+=2;sc[AF[k]]+=1;qi++;ask()}
function res(){const r=K.map(k=>[k,sc[k]]).sort((a,b)=>b[1]-a[1]),t=T[r[0][0]],mix=r[0][1]-r[1][1]<=3,s=T[r[1][0]],mx=r[0][1];
const H=(h,x)=>`<h3>${h}</h3>${x}`;
$.innerHTML=`<div class=bar><i style="width:100%"></i></div><div class=card><span class=stamp>твой тип</span><h1>${mix?FN[r[0][0]]+' + '+FN[r[1][0]]:FN[r[0][0]]+' тип'}</h1><h2>${mix?t.n+' + '+s.n.replace('Голос ','голос '):t.n}</h2><p class=hand>${mix?'У тебя смешанный профиль: оба голоса звучат в тебе':t.s}</p>
${mix?`<small>Разрыв между первым и вторым типом небольшой, поэтому читай оба: ниже основной разбор и вторая линия.</small>`:''}
${r.map(([k,v])=>`<div class=sb><span>${FN[k]}</span><i style="width:${v/mx*60}%"></i></div>`).join('')}
<a class="btn go" href="${IG}" target="_blank" rel="noopener">Записаться на занятие</a>${H('В двух словах',t.two)}${H('Как это проявляется в теле <small>(наблюдение, не диагноз)</small>',t.body)}${H('Как это может звучать',t.snd)}${H('Твоя сила',t.pw)}${H('Твоя ловушка',t.tr)}${H('Тебе может подойти',t.rp)}${H('Твой сценический вайб',t.vb)}
${H('Что тренировать','<ul>'+t.tn.map(x=>`<li>${x}</li>`).join('')+'</ul>')}
${H('Твой план на 30 дней','<ul>'+t.pl.map((x,i)=>`<li><b>Неделя ${i+1}:</b> ${x}</li>`).join('')+'</ul>')}
${mix?H('Вторая линия: '+s.n,`Сила: ${s.pw} Ловушка: ${s.tr}`):''}
<h3>Следующий шаг</h3><p>Теперь ты знаешь, какой паттерн может влиять на твоё пение. Следующий шаг: проверить, как он проявляется именно в твоём голосе.</p>
<p>На занятиях со мной мы не просто ставим ноты. Мы работаем с голосом через тело, вокальную технику, психологию и сценическое поведение, чтобы твои сильные стороны стали инструментом, а не случайностью.</p>
<p><b>Хочешь разобрать именно свой голос? Приходи на индивидуальное занятие.</b></p>
<a class="btn go" href="${IG}" target="_blank" rel="noopener">Записаться на занятие в Instagram</a></div>
<button class=btn onclick="start()">Пройти заново</button>
<p><small>Автор гайда: annieanniemusic, Анна Николаева. Тест не является диагностикой или медицинским заключением: типология Фрейда используется как метафора для саморефлексии. При боли или хрипоте обратитесь к фониатру.</small></p>`}
start();
</script></body></html>
